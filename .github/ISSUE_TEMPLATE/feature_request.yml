name: Feature request
description: An idea or wish for Familienhub
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation in your family, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Today, Tasks, Shopping, Meals, Calendar, Reminders, House, Notifications, Plugins, Themes, Apps, Other]
