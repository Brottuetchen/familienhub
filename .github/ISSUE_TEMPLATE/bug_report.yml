name: "Bug report"
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FamilienHub! English and German are both welcome.
        For security vulnerabilities, [report privately](https://github.com/Brottuetchen/familienhub/security/advisories/new).
        Never share passwords, tokens, private URLs, or personal family information.
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options:
        - Android
        - iOS
        - Web / PWA
        - Server / Docker
        - Plugin / integration
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Explain what you did and what happened.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version (optional)
      description: More → Send feedback
  - type: input
    id: server-version
    attributes:
      label: Server version (optional)
      description: Administration → Overview
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Remove credentials, private URLs and personal data before posting.
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I have searched for a similar issue.
