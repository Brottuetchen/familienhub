# Familienhub: backend + web app + PostgreSQL.
# Stable release: docker compose up -d (uses :latest).
# During beta, pin a published version, e.g. FAMILIENHUB_VERSION=1.0.0-beta.1 docker compose up -d.
# Optional settings go into a .env file next to this one (see .env.example).
# Building from source instead of pulling the image: see docker-compose.dev.yml.
# The Android/iOS app connects to the same address (http(s)://<host>:8000 or behind a reverse proxy).
services:
  familienhub:
    image: ghcr.io/brottuetchen/familienhub:${FAMILIENHUB_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # needs Docker Compose v2.24 or newer
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # The database is only reachable inside the compose network. The default password is fine;
      # to change it, set POSTGRES_PASSWORD in .env before the first start.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-familienhub}:${POSTGRES_PASSWORD:-familienhub}@db:5432/${POSTGRES_DB:-familienhub}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # generated SECRET_KEY lives here; keep this volume together with the database volume
      - familienhub_data:/app/data
      # optional: Firebase service account for Android push
      # - ./secrets/fcm-service-account.json:/app/secrets/fcm-service-account.json:ro
      # optional: serve app downloads (APK + index.html) under /downloads/; set DOWNLOADS_DIR=/app/downloads
      # (create the folder first: compose would create it owned by root)
      # - ./downloads:/app/downloads:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familienhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familienhub}
      POSTGRES_DB: ${POSTGRES_DB:-familienhub}
    volumes:
      - familienhub_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familienhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  familienhub_db:
  familienhub_data:
